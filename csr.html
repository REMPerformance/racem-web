<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RACEM | CSR katalóg</title>

<style>
/* ==== RACEM THEME ==== */
:root{
  --bg:#0b0d10; --panel:#10141a; --panel2:#0f1318;
  --text:#e8eef7; --muted:#9aa6b2; --line:#202834;
  --red:#b31f24;
  --radius:18px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,Segoe UI,Roboto,Arial;
  background:radial-gradient(900px 500px at 20% -10%, rgba(179,31,36,.18), transparent 60%),var(--bg);
  color:var(--text);
}
.wrap{max-width:1200px;margin:auto;padding:22px}

/* ==== TOP BAR ==== */
.topbar{
  display:flex;gap:12px;flex-wrap:wrap;align-items:center;
  padding:14px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:rgba(16,20,26,.8);
}
.pill{
  padding:8px 12px;border-radius:999px;
  border:1px solid rgba(179,31,36,.45);
  background:rgba(179,31,36,.15);
  font-weight:900;
}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto}
.select,.input{
  background:#0f1318;border:1px solid var(--line);
  color:var(--text);
  border-radius:12px;
  padding:10px 12px;
}
.btn{
  background:var(--red);
  color:#fff;
  font-weight:900;
  border:none;
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
}

/* ==== GRID ==== */
.grid{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:14px;
  margin-top:18px;
}
.card{
  grid-column:span 3;
  background:rgba(16,20,26,.8);
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  cursor:pointer;
}
.thumb{
  aspect-ratio:4/3;
  background:#111;
}
.thumb img{width:100%;height:100%;object-fit:cover}
.content{padding:12px}
.title{font-weight:900}
.sub{color:var(--muted);font-size:.9rem}
.price{margin-top:8px;font-weight:900;color:#fff}

/* ==== RESPONSIVE ==== */
@media(max-width:900px){.card{grid-column:span 6}}
@media(max-width:520px){.card{grid-column:span 12}}
</style>
</head>

<body>
<div class="wrap">

<div class="topbar">
  <div class="pill">RACEM <small>CSR katalóg</small></div>

  <div class="controls">
    <input id="q" class="input" placeholder="Hľadať názov / kód">

    <select id="make" class="select">
      <option value="">Všetci výrobcovia</option>
    </select>

    <select id="model" class="select" disabled>
      <option value="">Všetky modely</option>
    </select>

    <button id="reset" class="btn">Reset</button>
  </div>
</div>

<div id="grid" class="grid"></div>

</div>

<script>
/* ==== CONFIG ==== */
const DATA_URLS = [
  "./csr-products-SK.part1.json",
  "./csr-products-SK.part2.json"
];
const IMAGE_BASE = "https://pub-00566da7f565476b9f37d09cb0e1917f.r2.dev";

/* ==== STATE ==== */
let PRODUCTS = [];
let FILTERED = [];

/* ==== ELEMENTS ==== */
const els = {
  grid: document.getElementById("grid"),
  q: document.getElementById("q"),
  make: document.getElementById("make"),
  model: document.getElementById("model"),
  reset: document.getElementById("reset")
};

/* ==== LOAD ==== */
async function loadProducts(){
  const parts = await Promise.all(DATA_URLS.map(u=>fetch(u).then(r=>r.json())));
  PRODUCTS = parts.flatMap(p=>p.products);
  buildMakeFilter();
  applyFilters();
}

/* ==== FILTER BUILD ==== */
function buildMakeFilter(){
  const makes = [...new Set(PRODUCTS.map(p=>p.make))].sort();
  els.make.innerHTML = `<option value="">Všetci výrobcovia</option>` +
    makes.map(m=>`<option value="${m}">${m}</option>`).join("");
}

/* ==== MODEL FILTER ==== */
function buildModelFilter(make){
  const models = [...new Set(
    PRODUCTS.filter(p=>p.make===make).map(p=>p.model)
  )].sort();

  els.model.innerHTML =
    `<option value="">Všetky modely</option>` +
    models.map(m=>`<option value="${m}">${m}</option>`).join("");

  els.model.disabled = false;
}

/* ==== APPLY FILTER ==== */
function applyFilters(){
  const q = els.q.value.toLowerCase();
  const make = els.make.value;
  const model = els.model.value;

  FILTERED = PRODUCTS.filter(p=>{
    if (make && p.make!==make) return false;
    if (model && p.model!==model) return false;
    if (q && !(`${p.title} ${p.code}`.toLowerCase().includes(q))) return false;
    return true;
  });

  render();
}

/* ==== RENDER ==== */
function render(){
  els.grid.innerHTML = FILTERED.map(p=>`
    <div class="card">
      <div class="thumb">
        <img src="${IMAGE_BASE}/csr/${p.code}/${p.images?.[0]||""}"
             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22640%22 height=%22480%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%2310141a%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%239aa6b2%22 text-anchor=%22middle%22>No image</text></svg>'">
      </div>
      <div class="content">
        <div class="title">${p.title}</div>
        <div class="sub">${p.make} ${p.model}</div>
        <div class="price">${Number(p.priceEUR).toLocaleString("sk-SK",{style:"currency",currency:"EUR"})}</div>
      </div>
    </div>
  `).join("");
}

/* ==== EVENTS ==== */
els.make.addEventListener("change",()=>{
  els.model.value="";
  els.model.disabled=true;
  if (els.make.value) buildModelFilter(els.make.value);
  applyFilters();
});
els.model.addEventListener("change",applyFilters);
els.q.addEventListener("input",applyFilters);
els.reset.addEventListener("click",()=>{
  els.q.value="";
  els.make.value="";
  els.model.value="";
  els.model.disabled=true;
  applyFilters();
});

/* ==== INIT ==== */
loadProducts();
</script>
</body>
</html>
