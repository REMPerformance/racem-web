<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Košík | RACEM</title>
  <meta name="theme-color" content="#070707">
  <style>
    :root{
      --bg:#070707;--panel:#111;--line:rgba(255,255,255,.08);--text:#f5f5f5;--muted:#b9b9b9;
      --accent:#b31f24;--accent2:#e0353c;--radius:22px;--shadow:0 20px 60px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box} body{margin:0;color:var(--text);font-family:Arial,sans-serif;background:
      radial-gradient(circle at top left, rgba(179,31,36,.18), transparent 32%), linear-gradient(180deg,#050505,#090909);}
    a{color:inherit;text-decoration:none} img{display:block;max-width:100%}
    .wrap{width:min(1180px,calc(100% - 24px));margin:0 auto;padding:20px 0 70px}
    .panel{background:linear-gradient(180deg,#121212,#0c0c0c);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px}
    .title{font-size:34px;font-weight:900}
    .muted{color:var(--muted)}
    .btn{min-height:50px;padding:0 18px;border-radius:16px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer;background:#151515;color:#fff}
    .btn-main{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:rgba(179,31,36,.75)}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin-top:20px}
    .items{padding:18px;display:grid;gap:12px}
    .item{display:grid;grid-template-columns:110px 1fr auto;gap:14px;padding:12px;border:1px solid var(--line);border-radius:18px;background:#101010}
    .item img{width:110px;height:84px;object-fit:cover;border-radius:12px}
    .name{font-size:18px;font-weight:800;margin-bottom:6px}
    .variant{color:var(--muted);font-size:14px}
    .price{font-weight:800;margin-top:8px}
    .qtybox{display:flex;align-items:center;gap:8px}
    .qtybox button,.remove{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#171717;color:#fff;cursor:pointer}
    .summary{padding:18px;position:sticky;top:20px;height:fit-content}
    .row{display:flex;justify-content:space-between;gap:10px;margin:10px 0}
    .total{font-size:28px;font-weight:900}
    .empty{padding:26px;color:var(--muted)}
    @media (max-width:900px){.layout{grid-template-columns:1fr}.item{grid-template-columns:90px 1fr}.item img{width:90px;height:72px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel head">
      <div>
        <div class="title">Košík</div>
        <div class="muted">Produkty ostanú uložené, kým ich neodstrániš.</div>
      </div>
      <a class="btn" href="/sfxla.html">Pokračovať v nákupe</a>
    </div>

    <div class="layout">
      <div class="panel">
        <div id="cartItems" class="items"></div>
      </div>

      <div class="panel summary">
        <div class="row"><span class="muted">Položky</span><strong id="itemCount">0</strong></div>
        <div class="row"><span class="muted">Medzisúčet</span><strong id="subtotal">0 €</strong></div>
        <div class="row total"><span>Spolu</span><span id="total">0 €</span></div>
        <button class="btn btn-main" style="width:100%;margin-top:14px" onclick="RACEMCart.checkout()">Ku pokladni</button>
        <button class="btn" style="width:100%;margin-top:10px" onclick="RACEMCart.clear(); renderCart();">Vyprázdniť košík</button>
      </div>
    </div>
  </div>

  <script src="/assets/js/cart.js"></script>
  <script>
    function euro(v){ return `${Math.round(Number(v||0))} €`; }

    function renderCart() {
      const itemsWrap = document.getElementById("cartItems");
      const cart = window.RACEMCart ? window.RACEMCart.get() : [];
      const itemCount = cart.reduce((s, i) => s + Math.max(1, Number(i.qty || 1)), 0);
      const subtotal = cart.reduce((s, i) => s + (Number(i.priceEUR || 0) * Math.max(1, Number(i.qty || 1))), 0);

      document.getElementById("itemCount").textContent = String(itemCount);
      document.getElementById("subtotal").textContent = euro(subtotal);
      document.getElementById("total").textContent = euro(subtotal);

      if (!cart.length) {
        itemsWrap.innerHTML = '<div class="empty">Košík je zatiaľ prázdny.</div>';
        return;
      }

      itemsWrap.innerHTML = cart.map(item => `
        <div class="item">
          <img src="${item.image || '/assets/placeholder.webp'}" alt="">
          <div>
            <div class="name">${item.title || 'Produkt'}</div>
            <div class="variant">${item.variantName || 'Variant'}</div>
            <div class="price">${euro(item.priceEUR)}</div>
            <div style="margin-top:10px"><a class="muted" href="${item.url || '#'}">Späť na produkt</a></div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:end;gap:10px">
            <div class="qtybox">
              <button onclick="changeQty('${item.key}', -1)">−</button>
              <strong>${Math.max(1, Number(item.qty || 1))}</strong>
              <button onclick="changeQty('${item.key}', 1)">+</button>
            </div>
            <button class="remove" onclick="RACEMCart.remove('${item.key}'); renderCart();">×</button>
          </div>
        </div>
      `).join("");
    }

    function changeQty(key, delta) {
      const cart = RACEMCart.get();
      const item = cart.find(x => String(x.key) === String(key));
      if (!item) return;
      const next = Math.max(1, Number(item.qty || 1) + Number(delta || 0));
      RACEMCart.setQty(key, next);
      renderCart();
    }

    document.addEventListener("DOMContentLoaded", renderCart);
    window.addEventListener("racem:cart-updated", renderCart);
  </script>
</body>
</html>
